<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏 x AI 资讯</title>
<meta name="description" content="每日追踪游戏行业 AI 动态">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cpath d='M8 14h4v-4h2v4h4v2h-4v4h-2v-4H8v-2z' fill='%2300bfa5'/%3E%3Ccircle cx='24' cy='12' r='2' fill='%2300bfa5'/%3E%3Ccircle cx='24' cy='20' r='2' fill='%2300bfa5'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;color:#d1d5db;background:#141a21;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
a{color:#5eadff;text-decoration:none}
a:hover{color:#89c4ff}
.app{display:flex;height:100vh}

/* Sidebar */
.sb{width:180px;background:#141a21;border-right:1px solid #253040;display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;overflow-y:auto}
.sb-brand{padding:0 20px 24px;font-size:18px;font-weight:700;color:#fff}
.sb-brand span{color:#00d4ad}
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:6px;font-size:13px;color:#9ca3af;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.ni:hover{color:#d1d5db;background:#1c2530}
.ni.active{color:#fff;background:#00bfa5;font-weight:500}
.ni .ic{width:16px;text-align:center;font-size:14px;flex-shrink:0}
.ni .ni-desc{font-size:10px;color:#6b7280;margin-top:1px;white-space:normal;line-height:1.4}
.ni.active .ni-desc{color:rgba(255,255,255,0.7)}
.sb-div{height:1px;background:#253040;margin:12px 14px}
.sb-label{padding:4px 24px;font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:1px}

/* Main */
.mn{flex:1;overflow-y:auto;padding:0 0 60px}
.mn-hd{padding:28px 36px 20px;border-bottom:1px solid #253040}
.mn-title{font-size:22px;font-weight:700;color:#fff}
.mn-sub{font-size:13px;color:#9ca3af;margin-top:4px;line-height:1.6}

/* Week selector */
.wk-sel{display:flex;gap:8px;padding:16px 36px;border-bottom:1px solid #1c2530;flex-wrap:wrap}
.wk-btn{padding:5px 14px;border-radius:4px;font-size:12px;color:#9ca3af;cursor:pointer;border:1px solid #253040;background:transparent;transition:all 0.15s}
.wk-btn:hover{border-color:#3d4f5f;color:#d1d5db}
.wk-btn.active{background:#00bfa5;border-color:#00bfa5;color:#fff}

/* Highlights (top 5) */
.hl-section{padding:20px 36px;border-bottom:1px solid #253040}
.hl-label{font-size:12px;font-weight:600;color:#00d4ad;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.hl-list{list-style:none;counter-reset:hl}
.hl-item{counter-increment:hl;padding:8px 4px;font-size:14px;color:#e5e7eb;line-height:1.6;display:flex;gap:10px;cursor:pointer;border-radius:4px;transition:background 0.15s}
.hl-item:hover{background:#1c2530}
.hl-item a{color:#e5e7eb;text-decoration:none}
.hl-item a:hover{color:#5eadff}
.hl-item::before{content:counter(hl);flex-shrink:0;width:22px;height:22px;background:#253040;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#00d4ad}

/* Cards */
.cards{padding:16px 36px}
.card{background:#1c2530;border:1px solid #253040;border-radius:8px;padding:20px;margin-bottom:12px;transition:border-color 0.2s}
.card:hover{border-color:#3d4f5f}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-title{font-size:15px;font-weight:600;color:#f3f4f6;line-height:1.5;flex:1}
.card-title a{color:inherit}
.card-title a:hover{color:#5eadff}
.card-cat{flex-shrink:0;font-size:10px;padding:3px 8px;border-radius:3px;color:#9ca3af;font-weight:500;background:#253040;border:1px solid #3d4f5f}

.card-body{padding:10px 14px;background:rgba(0,212,173,0.03);border:1px solid #253040;border-radius:6px;margin-bottom:10px}
.card-row{display:flex;gap:0;margin-bottom:4px;font-size:13px;line-height:1.7}
.card-row:last-child{margin-bottom:0}
.card-row .lb{color:#00d4ad;font-weight:600;white-space:nowrap;margin-right:6px;flex-shrink:0}
.card-row .vl{color:#d1d5db}
.card-row .dt{color:#9ca3af}
.card-details{margin-top:6px;padding-left:12px;border-left:2px solid #253040}
.card-details li{font-size:12px;color:#9ca3af;line-height:1.7;margin-bottom:2px;list-style:none}
.card-details li::before{content:"";display:inline-block;width:4px;height:4px;background:#3d4f5f;border-radius:50%;margin-right:8px;vertical-align:middle}
.card-rec{font-size:12px;color:#00d4ad;padding:8px 12px;background:rgba(0,212,173,0.05);border-radius:4px;margin-top:8px;line-height:1.6}
.card-ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11px;color:#6b7280}
.card-ft .tags{display:flex;gap:4px;flex-wrap:wrap}
.card-ft .tags span{padding:2px 7px;background:#253040;border-radius:3px;color:#9ca3af;font-size:10px}

/* Search */
.search-bar{padding:12px 36px;border-bottom:1px solid #253040;display:flex;gap:8px}
.search-input{flex:1;height:34px;padding:0 12px;border:1px solid #3d4f5f;border-radius:6px;background:#141a21;color:#d1d5db;font-size:13px;outline:none}
.search-input:focus{border-color:#00bfa5}
.search-input::placeholder{color:#6b7280}
.search-btn{height:34px;padding:0 16px;border:none;border-radius:6px;background:#00bfa5;color:#fff;font-size:12px;font-weight:500;cursor:pointer}

/* Loading / Empty */
.state{text-align:center;padding:60px 36px;color:#9ca3af;font-size:14px}
.spinner{width:20px;height:20px;border:2px solid #253040;border-top-color:#00d4ad;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mobile nav toggle */
.mobile-nav{display:none;position:fixed;top:0;left:0;right:0;height:52px;background:#141a21;border-bottom:1px solid #253040;z-index:100;align-items:center;padding:0 16px;gap:12px}
.mobile-nav .mn-brand{font-size:16px;font-weight:700;color:#fff}
.mobile-nav .mn-brand span{color:#00d4ad}
.mobile-nav .hamburger{margin-left:auto;width:32px;height:32px;border:1px solid #253040;border-radius:6px;background:transparent;color:#9ca3af;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mobile-menu{display:none;position:fixed;top:52px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:99}
.mobile-menu.show{display:block}
.mobile-menu-inner{background:#1c2530;padding:16px;border-bottom:1px solid #253040;display:flex;flex-wrap:wrap;gap:8px}
.mobile-menu-inner .mm-btn{padding:8px 14px;border-radius:6px;font-size:13px;color:#9ca3af;background:#253040;border:none;cursor:pointer}
.mobile-menu-inner .mm-btn.active{background:#00bfa5;color:#fff}

/* Responsive */
@media(max-width:768px){
  .sb{display:none}
  .mobile-nav{display:flex}
  .mn{padding-top:52px}
  .mn-hd{padding:20px 16px 16px}
  .mn-title{font-size:18px}
  .mn-sub{font-size:12px}
  .wk-sel{padding:12px 16px;gap:6px}
  .wk-btn{padding:4px 10px;font-size:11px}
  .hl-section{padding:16px}
  .hl-item{font-size:13px;padding:6px 4px}
  .hl-item::before{width:20px;height:20px;font-size:10px}
  .cards{padding:12px 16px}
  .card{padding:16px}
  .card-title{font-size:14px}
  .card-body{padding:8px 10px}
  .card-row{font-size:12px}
  .card-details li{font-size:11px}
  .card-rec{font-size:11px;padding:6px 10px}
  .search-bar{padding:10px 16px}
}
</style>
</head>
<body>
<div class="app">

<!-- Mobile nav -->
<div class="mobile-nav">
  <div class="mn-brand">游戏<span>x</span>AI</div>
  <button class="hamburger" onclick="toggleMobileMenu()">&#9776;</button>
</div>
<div class="mobile-menu" id="mobile-menu" onclick="closeMobileMenu()">
  <div class="mobile-menu-inner" onclick="event.stopPropagation()">
    <button class="mm-btn active" data-mview="weekly">周报</button>
    <button class="mm-btn" data-mview="daily">每日</button>
    <button class="mm-btn" data-mview="cat" data-mcat="in-game">游戏内AI</button>
    <button class="mm-btn" data-mview="cat" data-mcat="creation">AI生成</button>
    <button class="mm-btn" data-mview="cat" data-mcat="dev-tools">开发工具</button>
    <button class="mm-btn" data-mview="cat" data-mcat="ops">运营</button>
    <button class="mm-btn" data-mview="cat" data-mcat="industry">行业</button>
    <button class="mm-btn" data-mview="cat" data-mcat="research">研究</button>
  </div>
</div>

<aside class="sb">
  <div class="sb-brand">游戏<span>x</span>AI 资讯</div>
  <nav class="sb-nav">
    <div class="ni active" data-view="weekly"><span class="ic">W</span>周报</div>
    <div class="ni" data-view="daily"><span class="ic">D</span>每日全量</div>
    <div class="sb-div"></div>
    <div class="sb-label">按分类</div>
    <div class="ni" data-view="cat" data-cat="in-game"><span class="ic" style="color:#059669">*</span>游戏内 AI</div>
    <div class="ni" data-view="cat" data-cat="creation"><span class="ic" style="color:#8b5cf6">*</span>AI 游戏生成</div>
    <div class="ni" data-view="cat" data-cat="dev-tools"><span class="ic" style="color:#2563eb">*</span>开发工具</div>
    <div class="ni" data-view="cat" data-cat="ops"><span class="ic" style="color:#d97706">*</span>运营商业化</div>
    <div class="ni" data-view="cat" data-cat="industry"><span class="ic" style="color:#dc2626">*</span>行业动态</div>
    <div class="ni" data-view="cat" data-cat="research"><span class="ic" style="color:#6366f1">*</span>前沿研究</div>
  </nav>
</aside>

<div class="mn" id="main"></div>

</div>

<script>
(function(){
'use strict';

const CAT_SHORT={creation:'生成与创作','in-game':'游戏内AI','dev-tools':'开发工具',ops:'运营商业化',industry:'行业动态',research:'前沿研究'};
const WEEKS=['2026-05-19','2026-05-12','2026-05-05'];
const DAILY_DATES=['2026-05-22','2026-05-21','2026-05-20','2026-05-19','2026-05-18','2026-05-17','2026-05-16','2026-05-15'];
const CAT_DESC={
  'in-game':'智能NPC、AI驱动玩法、个性化体验、AI原生游戏',
  creation:'AIGC资产生成、3D/音频/剧情生成、AI UGC、玩家创作工具',
  'dev-tools':'AI编程辅助、引擎AI功能、自动测试、工作流提效',
  ops:'智能推荐与分发、买量素材AI生成、玩家分群、反作弊',
  industry:'大厂AI战略、投融资、政策法规、市场数据、人事变动',
  research:'学术论文、GDC/SIGGRAPH、世界模型、游戏作为AI研究平台'
};

let weekData={},dailyData={},currentView='weekly',currentWeek=WEEKS[1],currentDaily=DAILY_DATES[0],currentCat='',dailyCat='all',query='';
const $main=document.getElementById('main');

// ====== Load weekly data ======
async function loadWeek(weekId){
  try{
    if(weekData[weekId])return weekData[weekId];
    const r=await fetch(`data/week-${weekId}.json`);
    if(!r.ok)return null;
    const d=await r.json();
    weekData[weekId]=d;
    return d;
  }catch(e){return null;}
}

// ====== Render views ======
async function renderWeekly(){
  $main.innerHTML='<div class="state"><div class="spinner"></div></div>';
  const d=await loadWeek(currentWeek);
  if(!d){$main.innerHTML='<div class="state">暂无数据</div>';return;}

  let weekBtns=WEEKS.map(w=>`<button class="wk-btn ${w===currentWeek?'active':''}" data-week="${w}">${fmtWeekLabel(w)}</button>`).join('');

  // Link highlights to items by matching text
  let highlights=d.highlights.map((h,i)=>{
    const matchItem=d.items[i];
    const url=matchItem?matchItem.url:'#';
    return `<li class="hl-item"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(h)}</a></li>`;
  }).join('');

  let cards=d.items.map(item=>renderCard(item)).join('');

  $main.innerHTML=`
    <div class="mn-hd"><h1 class="mn-title">${esc(d.title)}</h1><p class="mn-sub">覆盖 24 个游戏/AI 专业信源 + 150+ 实时热点源，经算法筛选与人工复核，提炼本周高价值信息</p></div>
    <div class="wk-sel">${weekBtns}</div>
    <div class="hl-section"><div class="hl-label">本周速递</div><ol class="hl-list">${highlights}</ol></div>
    <div class="cards">${cards}</div>
  `;

  // Bind week buttons
  $main.querySelectorAll('.wk-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{currentWeek=btn.dataset.week;renderWeekly();});
  });
}

async function renderDaily(){
  $main.innerHTML='<div class="state"><div class="spinner"></div></div>';
  let d=dailyData[currentDaily];
  if(!d){
    try{
      const r=await fetch(`data/${currentDaily}.json`);
      if(r.ok){d=await r.json();dailyData[currentDaily]=d;}
    }catch(e){}
  }
  if(!d){$main.innerHTML='<div class="state">暂无当日数据</div>';return;}

  let items=d.items||[];
  items.sort((a,b)=>(a.source_type==='primary'?0:1)-(b.source_type==='primary'?0:1));
  if(dailyCat!=='all')items=items.filter(i=>i.category===dailyCat);

  let dateBtns=DAILY_DATES.map(dt=>{
    const dd=new Date(dt);
    return `<button class="wk-btn ${dt===currentDaily?'active':''}" data-date="${dt}">${dd.getMonth()+1}/${dd.getDate()}</button>`;
  }).join('');

  let catBtns=`<button class="wk-btn ${dailyCat==='all'?'active':''}" data-dcat="all">全部</button>`;
  Object.keys(CAT_SHORT).forEach(k=>{
    catBtns+=`<button class="wk-btn ${dailyCat===k?'active':''}" data-dcat="${k}">${CAT_SHORT[k]}</button>`;
  });

  let cards=items.map(item=>renderDailyCard(item)).join('');
  if(items.length===0)cards='<div class="state">该分类当日暂无内容</div>';

  $main.innerHTML=`
    <div class="mn-hd"><h1 class="mn-title">每日资讯 - ${d.date||''}</h1><p class="mn-sub">覆盖 24 个游戏/AI 专业信源 + 150+ 实时热点源，经算法筛选与人工复核，提炼当日高价值信息</p></div>
    <div class="wk-sel">${dateBtns}</div>
    <div class="wk-sel" style="padding-top:0;border-bottom:1px solid #21262d">${catBtns}</div>
    <div class="search-bar"><input class="search-input" id="search" placeholder="搜索标题..." onkeydown="if(event.key==='Enter')filterDaily()"><button class="search-btn" onclick="filterDaily()">搜索</button></div>
    <div class="cards" id="daily-cards">${cards}</div>
  `;
  // Bind date buttons
  $main.querySelectorAll('[data-date]').forEach(btn=>{
    btn.addEventListener('click',()=>{currentDaily=btn.dataset.date;renderDaily();});
  });
  // Bind category buttons
  $main.querySelectorAll('[data-dcat]').forEach(btn=>{
    btn.addEventListener('click',()=>{dailyCat=btn.dataset.dcat;renderDaily();});
  });
}

async function renderCategory(cat){
  $main.innerHTML='<div class="state"><div class="spinner"></div></div>';
  // Collect from all weeks + daily
  let allItems=[];
  for(const w of WEEKS){
    const d=await loadWeek(w);
    if(d&&d.items)allItems.push(...d.items.filter(i=>i.category===cat));
  }
  // Also load daily data for more coverage
  for(const dt of DAILY_DATES){
    let d=dailyData[dt];
    if(!d){try{const r=await fetch(`data/${dt}.json`);if(r.ok){d=await r.json();dailyData[dt]=d;}}catch(e){}}
    if(d&&d.items){
      d.items.filter(i=>i.category===cat).forEach(item=>{
        if(!allItems.find(a=>a.url===item.url))allItems.push(item);
      });
    }
  }
  if(allItems.length===0){$main.innerHTML='<div class="state">暂无该分类内容</div>';return;}

  // Render: weekly items have key_point, daily items have summary
  let cards=allItems.map(item=>{
    if(item.key_point)return renderCard(item);
    return renderDailyCard(item);
  }).join('');
  const catDesc=CAT_DESC[cat]||'';
  $main.innerHTML=`
    <div class="mn-hd"><h1 class="mn-title">${esc(CAT_SHORT[cat]||cat)}</h1><p class="mn-sub">${esc(catDesc)}</p></div>
    <div class="cards">${cards}</div>
  `;
}

// ====== Card renderer (weekly format) ======
function renderCard(item){
  const cat=item.category||'industry';
  let detailsHtml='';
  if(item.details&&item.details.length){
    detailsHtml=`<ul class="card-details">${item.details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`;
  }
  return `<div class="card">
    <div class="card-hd">
      <div class="card-title"><a href="${esc(item.url||'#')}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
      <span class="card-cat cat-${cat}">${esc(CAT_SHORT[cat]||cat)}</span>
    </div>
    <div class="card-body">
      <div class="card-row"><span class="lb">核心:</span><span class="vl">${esc(item.key_point||'')}</span></div>
      ${detailsHtml}
    </div>
    ${item.recommendation?`<div class="card-rec">${esc(item.recommendation)}</div>`:''}
    <div class="card-ft">
      <span>${esc(item.source||'')} | ${esc(item.published_at||'')}</span>
      ${item.tags&&item.tags.length?`<div class="tags">${item.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

// Daily card (from raw JSON)
function renderDailyCard(item){
  const cat=item.category||'industry';
  const summary=(item.summary||'').replace(/\n/g,' ').slice(0,200);
  const title=makeTitle(item);
  return `<div class="card" data-title="${esc(item.title)}">
    <div class="card-hd">
      <div class="card-title"><a href="${esc(item.url||'#')}" target="_blank" rel="noopener">${title}</a></div>
      <span class="card-cat cat-${cat}">${esc(CAT_SHORT[cat]||cat)}</span>
    </div>
    <div class="card-body">
      <div class="card-row"><span class="lb">核心:</span><span class="vl">${esc(summary)}</span></div>
    </div>
    ${item.recommendation?`<div class="card-rec">${esc(item.recommendation)}</div>`:''}
    <div class="card-ft"><span>${esc(item.source||'')} | ${fmtDate(item.published_at)}</span>
      ${item.tags&&item.tags.length?`<div class="tags">${item.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

function makeTitle(item){
  const title=item.title||'';
  const source=item.source||'';
  const ascii=title.replace(/[^\x00-\x7F]/g,'').length/Math.max(title.length,1);
  if(ascii>0.5){
    // English - prepend source
    const summary=(item.summary||'').split(/[。\n]/)[0].replace(/^[^，]*[，,]\s*/,'').slice(0,60);
    if(summary.length>10)return esc(`【${source.split(/[(/]/)[0].trim()}】${summary}`);
    return esc(`【${source}】${title.slice(0,50)}`);
  }
  // Check if company already in title
  const companies=['米哈游','索尼','育碧','腾讯','网易','百度','NVIDIA','Google','Epic','Xbox','AMD','GitHub','Unity','Take-Two'];
  for(const c of companies){if(title.includes(c))return esc(title);}
  // Prefix source
  const short=source.split(/[(/（]/)[0].trim();
  if(short&&short.length<8)return esc(`【${short}】${title}`);
  return esc(title);
}

// ====== Utils ======
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate(iso){if(!iso)return'';try{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()}`}catch(e){return''}}
function fmtWeekLabel(w){const d=new Date(w);return`${d.getMonth()+1}.${d.getDate()} - ${d.getDate()+6}`;}

window.filterDaily=function(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('#daily-cards .card').forEach(c=>{
    const t=(c.dataset.title||'').toLowerCase();
    c.style.display=(!q||t.includes(q))?'':'none';
  });
};

// ====== Navigation ======
document.querySelectorAll('.ni').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    const view=item.dataset.view;
    if(view==='weekly'){currentView='weekly';renderWeekly();}
    else if(view==='daily'){currentView='daily';renderDaily();}
    else if(view==='cat'){currentView='cat';currentCat=item.dataset.cat;renderCategory(currentCat);}
  });
});

// ====== Mobile menu ======
window.toggleMobileMenu=function(){document.getElementById('mobile-menu').classList.toggle('show')};
window.closeMobileMenu=function(){document.getElementById('mobile-menu').classList.remove('show')};
document.querySelectorAll('.mm-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mm-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const view=btn.dataset.mview;
    if(view==='weekly'){currentView='weekly';renderWeekly();}
    else if(view==='daily'){currentView='daily';renderDaily();}
    else if(view==='cat'){currentView='cat';currentCat=btn.dataset.mcat;renderCategory(btn.dataset.mcat);}
    closeMobileMenu();
  });
});

// ====== Init: default weekly ======
renderWeekly();

})();
</script>
</body>
</html>
