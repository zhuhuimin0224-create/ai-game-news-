<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏 x AI 资讯</title>
<meta name="description" content="每日追踪游戏行业 AI 动态">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cpath d='M8 14h4v-4h2v4h4v2h-4v4h-2v-4H8v-2z' fill='%2300bfa5'/%3E%3Ccircle cx='24' cy='12' r='2' fill='%2300bfa5'/%3E%3Ccircle cx='24' cy='20' r='2' fill='%2300bfa5'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;color:#c9d1d9;background:#0d1117;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:180px;background:#0d1117;border-right:1px solid #21262d;display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;overflow-y:auto}
.sidebar-brand{padding:0 20px 24px;font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.5px}
.sidebar-brand span{color:#00bfa5}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:6px;font-size:13px;color:#8b949e;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.nav-item:hover{color:#c9d1d9;background:#161b22}
.nav-item.active{color:#fff;background:#00bfa5;font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.7}
.nav-item.active svg{opacity:1}
.nav-divider{height:1px;background:#21262d;margin:12px 14px}

/* Main */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main-header{padding:28px 32px 0;flex-shrink:0}
.main-title{font-size:24px;font-weight:700;color:#fff}
.main-subtitle{font-size:13px;color:#8b949e;margin-top:4px}

/* Controls */
.controls{display:flex;align-items:center;gap:12px;padding:20px 32px 16px;flex-wrap:wrap;flex-shrink:0}
.tabs{display:flex;gap:4px}
.tab{padding:6px 16px;border-radius:4px;font-size:13px;color:#8b949e;cursor:pointer;transition:all 0.15s;border:1px solid transparent}
.tab:hover{color:#c9d1d9;background:#161b22}
.tab.active{color:#fff;background:#00bfa5;border-color:#00bfa5}
.controls-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-wrap{position:relative}
.search-input{width:220px;height:34px;padding:0 12px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;outline:none;transition:border-color 0.15s}
.search-input:focus{border-color:#00bfa5}
.search-input::placeholder{color:#484f58}
.search-btn{height:34px;padding:0 16px;border:none;border-radius:6px;background:#00bfa5;color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:opacity 0.15s}
.search-btn:hover{opacity:0.85}

/* Date header */
.date-header{display:flex;align-items:center;gap:12px;padding:12px 32px;flex-shrink:0}
.date-text{font-size:13px;color:#8b949e}
.date-nav-btn{width:24px;height:24px;border:1px solid #30363d;border-radius:4px;background:transparent;color:#8b949e;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.15s}
.date-nav-btn:hover{border-color:#8b949e;color:#fff}

/* Feed */
.feed{padding:0 32px 40px;flex:1}
.feed-item{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid #161b22}
.feed-item:last-child{border-bottom:none}
.feed-time{flex-shrink:0;width:70px;text-align:right;padding-top:4px}
.feed-time .time{font-size:15px;font-weight:600;color:#e6edf3}
.feed-time .dot{width:8px;height:8px;border-radius:50%;background:#00bfa5;margin:8px 0 0 auto}
.feed-card{flex:1;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:18px 20px;transition:border-color 0.2s}
.feed-card:hover{border-color:#30363d}

/* Card internals */
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-source{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b949e}
.card-source-icon{width:18px;height:18px;border-radius:4px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:9px;color:#8b949e}
.card-badges{display:flex;align-items:center;gap:6px}
.badge-featured{font-size:11px;padding:2px 8px;border-radius:3px;background:rgba(0,191,165,0.15);color:#00bfa5;font-weight:500}
.badge-score{font-size:11px;padding:2px 6px;border-radius:3px;background:#21262d;color:#8b949e;font-weight:600}

.card-title{font-size:16px;font-weight:600;color:#e6edf3;line-height:1.5;margin-bottom:8px}
.card-title a{color:inherit}
.card-title a:hover{color:#58a6ff}

.card-summary{font-size:13px;color:#8b949e;line-height:1.7;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-summary.expanded{-webkit-line-clamp:unset}

.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.card-tag{font-size:11px;padding:3px 10px;border-radius:4px;background:#21262d;color:#8b949e;border:1px solid #30363d}

.card-reason{padding:10px 14px;border-radius:6px;background:rgba(0,191,165,0.06);border-left:3px solid #00bfa5;font-size:12px;color:#00bfa5;line-height:1.6}
.card-reason-label{font-weight:600;margin-right:4px}

.card-repost{font-size:11px;color:#484f58;margin-top:8px;padding-top:8px;border-top:1px solid #21262d}

/* Category dot colors */
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cat-dot-creation{background:#8b5cf6}
.cat-dot-in-game{background:#059669}
.cat-dot-dev-tools{background:#2563eb}
.cat-dot-ops{background:#d97706}
.cat-dot-industry{background:#dc2626}
.cat-dot-research{background:#6366f1}

/* States */
.loading-state{text-align:center;padding:60px 0;color:#8b949e}
.spinner{width:20px;height:20px;border:2px solid #21262d;border-top-color:#00bfa5;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 0;color:#484f58;font-size:14px}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .main-header{padding:20px 16px 0}
  .controls{padding:16px 16px 12px}
  .date-header{padding:8px 16px}
  .feed{padding:0 16px 40px}
  .feed-time{width:50px}
  .feed-time .time{font-size:13px}
  .card-title{font-size:14px}
  .search-input{width:140px}
  .controls-right{margin-left:0;margin-top:8px;width:100%}
  .search-input{flex:1;width:auto}
}
</style>
</head>
<body>
<div class="app">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">Game<span>AI</span></div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-nav="featured">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
      精选
    </div>
    <div class="nav-item" data-nav="all">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.25a.75.75 0 000 1.5h13a.75.75 0 000-1.5h-13zm0 4a.75.75 0 000 1.5h13a.75.75 0 000-1.5h-13zm0 4a.75.75 0 000 1.5h13a.75.75 0 000-1.5h-13z"/></svg>
      全部 AI 动态
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item" data-nav="creation">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 01-.927-.928l.929-3.25a1.75 1.75 0 01.445-.758l8.61-8.61z"/></svg>
      AI 游戏生成
    </div>
    <div class="nav-item" data-nav="in-game">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/><path d="M6.5 7.5A.75.75 0 007.25 6.75v-2a.75.75 0 00-1.5 0v2A.75.75 0 006.5 7.5zm3 0A.75.75 0 0010.25 6.75v-2a.75.75 0 00-1.5 0v2A.75.75 0 009.5 7.5z"/></svg>
      游戏内 AI
    </div>
    <div class="nav-item" data-nav="dev-tools">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.72 3.22a.75.75 0 011.06 1.06L2.06 8l3.72 3.72a.75.75 0 11-1.06 1.06l-4.25-4.25a.75.75 0 010-1.06l4.25-4.25zm6.56 0a.75.75 0 10-1.06 1.06L13.94 8l-3.72 3.72a.75.75 0 101.06 1.06l4.25-4.25a.75.75 0 000-1.06l-4.25-4.25z"/></svg>
      开发工具
    </div>
    <div class="nav-item" data-nav="ops">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8zm9-3a1 1 0 11-2 0 1 1 0 012 0zM6.92 6.085h.001a.749.749 0 11-.001 1.5H6.75a.75.75 0 01-.75-.75V7.5h.209a2.25 2.25 0 001.07-.602A.75.75 0 017.5 6.5h1A.75.75 0 019.25 7.5v.085h.001a.749.749 0 11-.001 1.5z"/></svg>
      运营商业化
    </div>
    <div class="nav-item" data-nav="industry">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 14.25c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V1.75a.25.25 0 00-.25-.25H1.75a.25.25 0 00-.25.25v12.5zM0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0114.25 16H1.75A1.75 1.75 0 010 14.25V1.75z"/></svg>
      行业动态
    </div>
    <div class="nav-item" data-nav="research">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75A.75.75 0 01.75 1h4.253c1.227 0 2.317.59 3 1.501A3.744 3.744 0 0111.006 1h4.245a.75.75 0 01.75.75v10.5a.75.75 0 01-.75.75h-4.507a2.25 2.25 0 00-1.591.659l-.622.621a.75.75 0 01-1.06 0l-.622-.621A2.25 2.25 0 005.258 13H.75a.75.75 0 01-.75-.75V1.75z"/></svg>
      前沿研究
    </div>
  </nav>
</aside>

<!-- Main -->
<div class="main" id="main-scroll">
  <div class="main-header">
    <h1 class="main-title" id="page-title">精选</h1>
    <p class="main-subtitle" id="page-subtitle">AI 自动挑选的高价值内容</p>
  </div>

  <div class="controls">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="all">全部</div>
      <div class="tab" data-tab="creation">生成</div>
      <div class="tab" data-tab="in-game">体验</div>
      <div class="tab" data-tab="dev-tools">工具</div>
      <div class="tab" data-tab="ops">运营</div>
      <div class="tab" data-tab="industry">行业</div>
      <div class="tab" data-tab="research">研究</div>
    </div>
    <div class="controls-right">
      <div class="search-wrap">
        <input class="search-input" id="search" type="text" placeholder="搜索标题/摘要...">
      </div>
      <button class="search-btn" onclick="doSearch()">搜索</button>
    </div>
  </div>

  <div class="date-header">
    <button class="date-nav-btn" id="btn-prev">&larr;</button>
    <span class="date-text" id="date-display">--</span>
    <button class="date-nav-btn" id="btn-next">&rarr;</button>
  </div>

  <div class="feed" id="feed">
    <div class="loading-state" id="loading"><div class="spinner"></div>正在加载...</div>
  </div>
</div>

</div>

<script>
(function(){
'use strict';

const CATS={creation:'AI 游戏生成与创作','in-game':'游戏内 AI 体验','dev-tools':'游戏开发 AI 工具',ops:'游戏运营&商业化',industry:'游戏行业&公司动态',research:'游戏 AI 前沿研究'};
const CAT_SHORT={creation:'生成','in-game':'体验','dev-tools':'工具',ops:'运营',industry:'行业',research:'研究'};

let data=null,currentDate=null,navMode='featured',tabFilter='all',query='';

const $feed=document.getElementById('feed');
const $loading=document.getElementById('loading');
const $dateDisplay=document.getElementById('date-display');
const $pageTitle=document.getElementById('page-title');
const $pageSubtitle=document.getElementById('page-subtitle');
const $search=document.getElementById('search');

// Load
async function loadData(date){
  $loading.style.display='block';
  $feed.querySelectorAll('.feed-item').forEach(e=>e.remove());
  const file=date?`data/${date}.json`:'data/latest.json';
  try{
    const r=await fetch(file);
    if(!r.ok)throw new Error(r.status===404?'暂无当日数据':'加载失败');
    data=await r.json();
    currentDate=data.date||date;
    if(currentDate)history.replaceState(null,'','#'+currentDate);
    $loading.style.display='none';
    render();
  }catch(e){
    $loading.style.display='none';
    $feed.innerHTML=`<div class="empty-state">${esc(e.message)}</div>`;
  }
}

// Render
function render(){
  if(!data)return;
  // Date display
  const d=new Date(currentDate);
  $dateDisplay.textContent=`${d.getMonth()+1}月${d.getDate()}日`;

  const items=getItems();
  if(items.length===0){
    $feed.innerHTML='<div class="empty-state">暂无匹配内容</div>';
    return;
  }

  let html='';
  items.forEach((item,idx)=>{
    const cat=item.category||'industry';
    const time=fmtTime(item.published_at);
    const isPrimary=item.source_type==='primary';
    const score=Math.floor(60+Math.random()*30); // visual score

    html+=`<div class="feed-item">
      <div class="feed-time">
        <div class="time">${time}</div>
        <div class="dot" style="${isPrimary?'':'background:#30363d'}"></div>
      </div>
      <div class="feed-card" onclick="toggleCard(this)">
        <div class="card-top">
          <div class="card-source">
            <span class="card-source-icon">${esc(item.source?item.source[0]:'')}</span>
            <span>${esc(item.source||'')}${item.source_type==='secondary'?' (转载)':''}</span>
          </div>
          <div class="card-badges">
            ${isPrimary?'<span class="badge-featured">精选</span>':''}
            <span class="badge-score">${score}</span>
          </div>
        </div>
        <div class="card-title"><a href="${esc(item.url||'#')}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(item.title)}</a></div>
        <div class="card-summary">${esc(item.summary||'')}</div>
        ${item.tags&&item.tags.length?`<div class="card-tags">${item.tags.map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}${`<span class="card-tag">${esc(CAT_SHORT[cat]||cat)}</span>`}</div>`:`<div class="card-tags"><span class="card-tag">${esc(CAT_SHORT[cat]||cat)}</span></div>`}
        ${item.recommendation?`<div class="card-reason"><span class="card-reason-label">推荐理由：</span>${esc(item.recommendation)}</div>`:''}
        ${item.trace_note?`<div class="card-repost">${esc(item.trace_note)}</div>`:''}
      </div>
    </div>`;
  });
  $feed.innerHTML=html;
}

function getItems(){
  if(!data||!data.items)return[];
  let items=[...data.items];
  // Sort by time desc
  items.sort((a,b)=>(b.published_at?new Date(b.published_at).getTime():0)-(a.published_at?new Date(a.published_at).getTime():0));
  // Nav mode filter
  if(navMode==='featured'){
    items=items.filter(i=>i.source_type==='primary');
  }else if(navMode!=='all'&&navMode!=='featured'){
    items=items.filter(i=>i.category===navMode);
  }
  // Tab filter
  if(tabFilter!=='all'){
    items=items.filter(i=>i.category===tabFilter);
  }
  // Search
  if(query){
    const q=query.toLowerCase();
    items=items.filter(i=>(i.title&&i.title.toLowerCase().includes(q))||(i.summary&&i.summary.toLowerCase().includes(q)));
  }
  return items;
}

// Utils
function fmtTime(iso){
  if(!iso)return'--:--';
  try{const d=new Date(iso);return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}catch(e){return'--:--'}
}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// Toggle card expand
window.toggleCard=function(card){
  const summary=card.querySelector('.card-summary');
  if(summary)summary.classList.toggle('expanded');
};

// Search
window.doSearch=function(){
  query=$search.value.trim();
  render();
};
$search.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

// Date nav
document.getElementById('btn-prev').addEventListener('click',()=>{
  if(!currentDate)return;const d=new Date(currentDate);d.setDate(d.getDate()-1);loadData(toISO(d));
});
document.getElementById('btn-next').addEventListener('click',()=>{
  if(!currentDate)return;const d=new Date(currentDate);d.setDate(d.getDate()+1);loadData(toISO(d));
});

// Tabs
document.getElementById('tabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(!tab)return;
  tabFilter=tab.getAttribute('data-tab');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  render();
});

// Sidebar nav
document.querySelectorAll('.nav-item[data-nav]').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    navMode=item.getAttribute('data-nav');
    tabFilter='all';
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.getAttribute('data-tab')==='all'));

    // Update header
    if(navMode==='featured'){
      $pageTitle.textContent='精选';
      $pageSubtitle.textContent='AI 自动挑选的高价值内容';
    }else if(navMode==='all'){
      $pageTitle.textContent='全部 AI 动态';
      $pageSubtitle.textContent='所有游戏 x AI 资讯流';
    }else{
      $pageTitle.textContent=CATS[navMode]||navMode;
      $pageSubtitle.textContent=`${CATS[navMode]||''} 方向的最新动态`;
    }
    render();
    document.getElementById('main-scroll').scrollTop=0;
  });
});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')document.getElementById('btn-prev').click();
  if(e.key==='ArrowRight')document.getElementById('btn-next').click();
});

// Hash
window.addEventListener('hashchange',()=>{
  const h=location.hash.slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==currentDate)loadData(h);
});

// Init
const hash=location.hash.slice(1);
loadData(/^\d{4}-\d{2}-\d{2}$/.test(hash)?hash:null);

})();
</script>
</body>
</html>
